spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/datapulse_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:rupeshkumarsah.2024cse@sece.ac.in}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8083}

logging:
  level:
    root: INFO

app:
  jwt:
    secret: ${JWT_SECRET:DataPulseSecretKeyForJWTGeneration2026Secure}
    expiration: 86400000

management:
  health:
    mail:
      enabled: false